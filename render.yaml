services:
  - type: web
    name: allocation-engine
    runtime: python
    buildCommand: pip install -r requirements.txt && python scripts/check_schemas.py
    startCommand: gunicorn app.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: ENABLED_BROKERS
        sync: false
      - key: DEFAULT_BROKER
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ALPACA_PAPER
        sync: false
      - key: RUNTIME_SERVICE_URL
        sync: false
      - key: NETLIFY_API_TOKEN
        sync: false
      - key: NETLIFY_SITE_ID
        sync: false
      # Robinhood auth + reads route through the auth-service box
      - key: AUTH_SERVICE_URL
        sync: false
      - key: RH_AUTH_SERVICE_REQUEST_TOKEN
        sync: false
      # Trading DB write path (orders + positions)
      - key: TRADING_DB_URL
        sync: false
      - key: TRADING_DB_TOKEN
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: DRY_RUN
        value: "true"
      - key: ENGINE_BROKER
        value: "alpaca"
      - key: POLL_INTERVAL_SECONDS
        value: "60"
    healthCheckPath: /api/health

  # ── Alpha / Staging Environment ──────────────────────────────────
  - type: web
    name: allocation-engine-alpha
    runtime: python
    branch: IamJasonBian/alpaca-enable-options
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: ENABLED_BROKERS
        sync: false
      - key: DEFAULT_BROKER
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ALPACA_PAPER
        sync: false
      - key: RUNTIME_SERVICE_URL
        sync: false
      - key: NETLIFY_API_TOKEN
        sync: false
      - key: NETLIFY_SITE_ID
        sync: false
      # Robinhood auth + reads route through the auth-service box
      - key: AUTH_SERVICE_URL
        sync: false
      - key: RH_AUTH_SERVICE_REQUEST_TOKEN
        sync: false
      # Trading DB write path (orders + positions)
      - key: TRADING_DB_URL
        sync: false
      - key: TRADING_DB_TOKEN
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: DRY_RUN
        value: "true"
      - key: ENGINE_BROKER
        value: "alpaca"
      - key: POLL_INTERVAL_SECONDS
        value: "60"
    healthCheckPath: /api/health

  # ── One-order lifecycle manager ──────────────────────────────────
  # Manages exactly one option spread order (see app/spread_manager.py).
  # Order/instrument ids are set on the service, not committed here.
  - type: worker
    name: spread-manager
    runtime: python
    branch: main
    autoDeploy: false
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.spread_manager
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: AUTH_SERVICE_URL
        sync: false
      - key: RH_AUTH_SERVICE_REQUEST_TOKEN
        sync: false
      - key: SPREAD_MANAGER_DRY_RUN
        value: "true"
      - key: SPREAD_TP_PCT_OF_MAX
        value: "50"
      - key: SPREAD_GUARD_TIME_ET
        value: "09:45"
      - key: SPREAD_HARD_TIME_ET
        value: "12:30"
      - key: SPREAD_TP_NOT_BEFORE_ET
        sync: false
      - key: SPREAD_ORDER_ID
        sync: false
      - key: SPREAD_LONG_ID
        sync: false
      - key: SPREAD_SHORT_ID
        sync: false
      - key: SPREAD_SYMBOL
        sync: false
      - key: SPREAD_EXPIRATION
        sync: false
      - key: SPREAD_LONG_STRIKE
        sync: false
      - key: SPREAD_SHORT_STRIKE
        sync: false
