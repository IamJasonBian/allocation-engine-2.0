services:
  - type: web
    name: allocation-engine
    runtime: python
    buildCommand: pip install -r requirements.txt && python scripts/check_schemas.py
    startCommand: gunicorn app.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: ENABLED_BROKERS
        sync: false
      - key: DEFAULT_BROKER
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ALPACA_PAPER
        sync: false
      - key: RUNTIME_SERVICE_URL
        sync: false
      - key: NETLIFY_API_TOKEN
        sync: false
      - key: NETLIFY_SITE_ID
        sync: false
      # Robinhood auth + reads route through the auth-service box
      - key: AUTH_SERVICE_URL
        sync: false
      - key: RH_AUTH_SERVICE_REQUEST_TOKEN
        sync: false
      # Gates every mutating /api/* route and the /api/robinhood/* relay.
      # Those reach the broker with our own credentials, so they stay closed
      # until this is set.
      - key: RH_PROXY_TOKEN
        sync: false
      # Trading DB write path (orders + positions)
      - key: TRADING_DB_URL
        sync: false
      - key: TRADING_DB_TOKEN
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: DRY_RUN
        value: "true"
      - key: ENGINE_ENABLED
        value: "true"
      - key: ENGINE_BROKER
        value: "alpaca"
      - key: POLL_INTERVAL_SECONDS
        value: "60"
    healthCheckPath: /api/health

  # ── Alpha / Staging Environment ──────────────────────────────────
  - type: web
    name: allocation-engine-alpha
    runtime: python
    branch: IamJasonBian/alpaca-enable-options
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: ENABLED_BROKERS
        sync: false
      - key: DEFAULT_BROKER
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ALPACA_PAPER
        sync: false
      - key: RUNTIME_SERVICE_URL
        sync: false
      - key: NETLIFY_API_TOKEN
        sync: false
      - key: NETLIFY_SITE_ID
        sync: false
      # Robinhood auth + reads route through the auth-service box
      - key: AUTH_SERVICE_URL
        sync: false
      - key: RH_AUTH_SERVICE_REQUEST_TOKEN
        sync: false
      # Gates every mutating /api/* route and the /api/robinhood/* relay.
      # Those reach the broker with our own credentials, so they stay closed
      # until this is set.
      - key: RH_PROXY_TOKEN
        sync: false
      # Trading DB write path (orders + positions)
      - key: TRADING_DB_URL
        sync: false
      - key: TRADING_DB_TOKEN
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: DRY_RUN
        value: "true"
      - key: ENGINE_ENABLED
        value: "true"
      - key: ENGINE_BROKER
        value: "alpaca"
      - key: POLL_INTERVAL_SECONDS
        value: "60"
    healthCheckPath: /api/health
