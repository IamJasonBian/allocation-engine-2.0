name: Unload Options Chain

on:
  schedule:
    # Every 15 min during US market hours (weekdays 14:30-21:00 UTC = 9:30-16:00 ET)
    - cron: '*/15 14-21 * * 1-5'
    # Hourly outside market hours
    - cron: '0 0-14,22-23 * * 1-5'
  workflow_dispatch:

concurrency:
  group: unload-options-chain
  cancel-in-progress: false

jobs:
  unload:
    runs-on: ubuntu-latest
    steps:
      - name: Record job start (cost baseline)
        run: echo "UNLOAD_JOB_START_EPOCH=$(date +%s.%N)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests redis

      - name: Unload options chain to blobs
        id: unload
        env:
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          NETLIFY_API_TOKEN: ${{ secrets.NETLIFY_API_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          OPTIONS_SYMBOLS: "NBIS,AVGO,SPY,IWN,MU,CRWD"
          BLOB_RETENTION_DAYS: "14"
          UNLOAD_JOB_START_EPOCH: ${{ env.UNLOAD_JOB_START_EPOCH }}
        run: python scripts/unload_options_chain.py

      - name: Job cost footer
        if: always()
        run: |
          END=$(date +%s.%N)
          START="${UNLOAD_JOB_START_EPOCH:-$END}"
          SEC=$(python3 -c "print(round(float('$END') - float('$START'), 2))")
          MIN=$(python3 -c "print(round(float('$SEC') / 60.0, 4))")
          USD=$(python3 -c "print(round(float('$MIN') * 0.008, 6))")
          echo "### Workflow job cost" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Wall time: **${SEC}s** (${MIN} min, ~\$${USD} at \$0.008/min)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run: [\`${{ github.run_id }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> "$GITHUB_STEP_SUMMARY"
          echo "[cost] job_wall_sec=${SEC} job_min_est=${MIN} job_usd_est=${USD} run_id=${{ github.run_id }}"
